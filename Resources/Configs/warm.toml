#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base   = 0x9FC00000
size   = 0x300000
blocks = 0x300

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "none"
append_dtb         = false

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
os_version     = "17.0.0"
os_patch_level = "2026-11"
